{{- $ns := include "ontoportal.namespace" . -}}
{{- if and .Values.persistence.enabled (not .Values.persistence.shared.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ontoportal.fullname" . }}-shared-data
  namespace: {{ $ns }}
  labels:
    {{- include "ontoportal.labels" . | nindent 4 }}
  {{- include "ontoportal.annotations" . | nindent 2 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.shared.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.shared.size }}
  {{- $sc := .Values.persistence.shared.storageClassName | default .Values.global.storageClassName }}
  {{- if $sc }}
  storageClassName: {{ $sc | quote }}
  {{- end }}
---
{{ end }}
{{- if and .Values.persistence.enabled .Values.solr.enabled (not .Values.persistence.solr.existingClaim) }}
{{- $solrClaims := list "solr" -}}
{{- if eq (.Values.solr.mode | default "single") "split" -}}
{{- $solrClaims = list "solr-term" "solr-prop" -}}
{{- end -}}
{{- range $i, $suffix := $solrClaims }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ontoportal.fullname" $ }}-{{ $suffix }}-data
  namespace: {{ $ns }}
  labels:
    {{- include "ontoportal.labels" $ | nindent 4 }}
  {{- include "ontoportal.annotations" $ | nindent 2 }}
spec:
  accessModes:
    {{- toYaml $.Values.persistence.solr.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ $.Values.persistence.solr.size }}
  {{- $sc := $.Values.persistence.solr.storageClassName | default $.Values.global.storageClassName }}
  {{- if $sc }}
  storageClassName: {{ $sc | quote }}
  {{- end }}
---
{{ end }}
{{- end }}
{{- if and .Values.persistence.enabled .Values.redis.enabled .Values.redis.persistent (not .Values.persistence.redis.existingClaim) }}
{{- $redisClaim := "redis" -}}
{{- if eq (.Values.redis.mode | default "shared") "split" -}}
{{- $redisClaim = "redis-persistent" -}}
{{- end -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ontoportal.fullname" . }}-{{ $redisClaim }}-data
  namespace: {{ $ns }}
  labels:
    {{- include "ontoportal.labels" . | nindent 4 }}
  {{- include "ontoportal.annotations" . | nindent 2 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.redis.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.redis.size }}
  {{- $sc := .Values.persistence.redis.storageClassName | default .Values.global.storageClassName }}
  {{- if $sc }}
  storageClassName: {{ $sc | quote }}
  {{- end }}
---
{{ end }}
{{- if and .Values.persistence.enabled .Values.store.enabled (ne .Values.store.engine "external") (not .Values.persistence.store.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
