{{- if .Values.fairness.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ontoportal.fullname" . }}-fairness
  namespace: {{ include "ontoportal.namespace" . }}
  labels:
    app.kubernetes.io/component: fairness
    {{- include "ontoportal.labels" . | nindent 4 }}
  {{- include "ontoportal.annotations" . | nindent 2 }}
spec:
  ports:
    - name: http
      port: {{ .Values.fairness.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/component: fairness
    {{- include "ontoportal.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ontoportal.fullname" . }}-fairness
  namespace: {{ include "ontoportal.namespace" . }}
  labels:
    app.kubernetes.io/component: fairness
    {{- include "ontoportal.labels" . | nindent 4 }}
  {{- include "ontoportal.annotations" . | nindent 2 }}
spec:
  replicas: {{ .Values.fairness.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: fairness
      {{- include "ontoportal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: fairness
        {{- include "ontoportal.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ontoportal.fullname" . }}
      {{- include "ontoportal.podSecurityContext" . | nindent 6 }}
      {{- include "ontoportal.componentScheduling" (list .Values.fairness .) | nindent 6 }}
      containers:
        - name: fairness
          image: {{ include "ontoportal.image" .Values.images.fairness | quote }}
          imagePullPolicy: {{ .Values.images.fairness.pullPolicy }}
          {{- include "ontoportal.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.fairness.service.port }}
          env:
            - name: ONTOPORTAL_API_URL
              value: {{ printf "http://%s-api:%v" (include "ontoportal.fullname" .) .Values.api.service.port | quote }}
            - name: ONTOPORTAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ontoportal.secretName" . }}
                  key: apiKey
          {{- with .Values.fairness.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
