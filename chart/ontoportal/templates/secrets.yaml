{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- $ns := include "ontoportal.namespace" . -}}
{{- $name := include "ontoportal.secretName" . -}}
{{- $existing := (lookup "v1" "Secret" $ns $name) | default dict -}}
{{- $data := $existing.data | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "ontoportal.labels" . | nindent 4 }}
  {{- include "ontoportal.annotations" . | nindent 2 }}
type: Opaque
stringData:
  apiKey: {{ .Values.secrets.apiKey | default ((get $data "apiKey" | default "") | b64dec) | default (randAlphaNum 36) | quote }}
  adminPassword: {{ .Values.secrets.admin.password | default ((get $data "adminPassword" | default "") | b64dec) | default (randAlphaNum 24) | quote }}
  mysqlRootPassword: {{ .Values.secrets.mysqlRootPassword | default ((get $data "mysqlRootPassword" | default "") | b64dec) | default (randAlphaNum 24) | quote }}
  storeDbaPassword: {{ .Values.secrets.storeDbaPassword | default ((get $data "storeDbaPassword" | default "") | b64dec) | default (randAlphaNum 24) | quote }}
  storeDavPassword: {{ .Values.secrets.storeDavPassword | default ((get $data "storeDavPassword" | default "") | b64dec) | default (randAlphaNum 24) | quote }}
  matomoDbPassword: {{ .Values.secrets.matomoDbPassword | default ((get $data "matomoDbPassword" | default "") | b64dec) | default (randAlphaNum 24) | quote }}
  matomoDbRootPassword: {{ .Values.secrets.matomoDbRootPassword | default ((get $data "matomoDbRootPassword" | default "") | b64dec) | default (randAlphaNum 24) | quote }}
  mobiSyncInternalToken: {{ .Values.secrets.mobiSyncInternalToken | default ((get $data "mobiSyncInternalToken" | default "") | b64dec) | default (randAlphaNum 36) | quote }}
{{- end }}
