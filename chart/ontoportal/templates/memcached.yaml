{{- if .Values.memcached.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ontoportal.fullname" . }}-cache
  namespace: {{ include "ontoportal.namespace" . }}
  labels:
    app.kubernetes.io/component: cache
    {{- include "ontoportal.labels" . | nindent 4 }}
  {{- include "ontoportal.annotations" . | nindent 2 }}
spec:
  ports:
    - name: memcached
      port: 11211
      targetPort: memcached
  selector:
    app.kubernetes.io/component: cache
    {{- include "ontoportal.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ontoportal.fullname" . }}-cache
  namespace: {{ include "ontoportal.namespace" . }}
  labels:
    app.kubernetes.io/component: cache
    {{- include "ontoportal.labels" . | nindent 4 }}
  {{- include "ontoportal.annotations" . | nindent 2 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: cache
      {{- include "ontoportal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: cache
        {{- include "ontoportal.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ontoportal.fullname" . }}
      {{- include "ontoportal.podSecurityContext" . | nindent 6 }}
      {{- include "ontoportal.componentScheduling" (list .Values.memcached .) | nindent 6 }}
      containers:
        - name: memcached
          image: {{ include "ontoportal.image" .Values.images.memcached | quote }}
          imagePullPolicy: {{ .Values.images.memcached.pullPolicy }}
          {{- include "ontoportal.containerSecurityContext" . | nindent 10 }}
          args: ["-m", {{ .Values.memcached.memoryMb | quote }}]
          ports:
            - name: memcached
              containerPort: 11211
          {{- with .Values.memcached.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
