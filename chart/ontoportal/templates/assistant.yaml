{{- if .Values.assistant.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ontoportal.fullname" . }}-assistant
  namespace: {{ include "ontoportal.namespace" . }}
  labels:
    app.kubernetes.io/component: assistant
    {{- include "ontoportal.labels" . | nindent 4 }}
  {{- include "ontoportal.annotations" . | nindent 2 }}
spec:
  ports:
    - name: http
      port: {{ .Values.assistant.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/component: assistant
    {{- include "ontoportal.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ontoportal.fullname" . }}-assistant
  namespace: {{ include "ontoportal.namespace" . }}
  labels:
    app.kubernetes.io/component: assistant
    {{- include "ontoportal.labels" . | nindent 4 }}
  {{- include "ontoportal.annotations" . | nindent 2 }}
spec:
  replicas: {{ .Values.assistant.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: assistant
      {{- include "ontoportal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: assistant
        {{- include "ontoportal.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ontoportal.fullname" . }}
      {{- include "ontoportal.podSecurityContext" . | nindent 6 }}
      {{- include "ontoportal.componentScheduling" (list .Values.assistant .) | nindent 6 }}
      containers:
        - name: assistant
          image: {{ include "ontoportal.image" .Values.images.assistant | quote }}
          imagePullPolicy: {{ .Values.images.assistant.pullPolicy }}
          {{- include "ontoportal.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.assistant.service.port }}
          env:
            - name: ONTOPORTAL_API_URL
              value: {{ printf "http://%s-api:%v" (include "ontoportal.fullname" .) .Values.api.service.port | quote }}
            - name: ONTOPORTAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.assistant.ontoportalApiKeySecret.name | default (include "ontoportal.secretName" .) }}
                  key: {{ .Values.assistant.ontoportalApiKeySecret.key | default "apiKey" }}
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.assistant.internalTokenSecret.name | default (include "ontoportal.secretName" .) }}
                  key: {{ .Values.assistant.internalTokenSecret.key | default "mobiSyncInternalToken" }}
            {{- if .Values.assistant.databaseUrl }}
            - name: DATABASE_URL
              value: {{ .Values.assistant.databaseUrl | quote }}
            {{- end }}
            {{- if .Values.assistant.openaiApiKeySecret.name }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.assistant.openaiApiKeySecret.name }}
                  key: {{ .Values.assistant.openaiApiKeySecret.key }}
            {{- end }}
          {{- with .Values.assistant.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
