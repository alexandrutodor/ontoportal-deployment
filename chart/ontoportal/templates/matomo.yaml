{{- if .Values.matomo.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ontoportal.fullname" . }}-matomo-db
  namespace: {{ include "ontoportal.namespace" . }}
  labels:
    app.kubernetes.io/component: matomo-db
    {{- include "ontoportal.labels" . | nindent 4 }}
  {{- include "ontoportal.annotations" . | nindent 2 }}
spec:
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
  selector:
    app.kubernetes.io/component: matomo-db
    {{- include "ontoportal.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ontoportal.fullname" . }}-matomo-db
  namespace: {{ include "ontoportal.namespace" . }}
  labels:
    app.kubernetes.io/component: matomo-db
    {{- include "ontoportal.labels" . | nindent 4 }}
  {{- include "ontoportal.annotations" . | nindent 2 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: matomo-db
      {{- include "ontoportal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: matomo-db
        {{- include "ontoportal.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ontoportal.fullname" . }}
      {{- include "ontoportal.podSecurityContext" . | nindent 6 }}
      {{- include "ontoportal.componentScheduling" (list .Values.matomo .) | nindent 6 }}
      containers:
        - name: mariadb
          image: {{ include "ontoportal.image" .Values.images.matomoDb | quote }}
          imagePullPolicy: {{ .Values.images.matomoDb.pullPolicy }}
          {{- include "ontoportal.containerSecurityContext" . | nindent 10 }}
          env:
            - name: MARIADB_DATABASE
              value: {{ .Values.matomo.db.name | quote }}
            - name: MARIADB_USER
              value: {{ .Values.matomo.db.user | quote }}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ontoportal.secretName" . }}
                  key: matomoDbPassword
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ontoportal.secretName" . }}
                  key: matomoDbRootPassword
          ports:
            - name: mysql
              containerPort: 3306
          {{- with .Values.matomo.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: matomo-db
              mountPath: /var/lib/mysql
      volumes:
        - name: matomo-db
          {{- include "ontoportal.volumeDataSource" (list . .Values.persistence.matomo.db.existingClaim (printf "%s-matomo-db" (include "ontoportal.fullname" .))) | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ontoportal.fullname" . }}-matomo
  namespace: {{ include "ontoportal.namespace" . }}
  labels:
    app.kubernetes.io/component: matomo
    {{- include "ontoportal.labels" . | nindent 4 }}
  {{- include "ontoportal.annotations" . | nindent 2 }}
spec:
  ports:
    - name: http
      port: {{ .Values.matomo.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/component: matomo
    {{- include "ontoportal.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ontoportal.fullname" . }}-matomo
  namespace: {{ include "ontoportal.namespace" . }}
  labels:
    app.kubernetes.io/component: matomo
    {{- include "ontoportal.labels" . | nindent 4 }}
  {{- include "ontoportal.annotations" . | nindent 2 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: matomo
      {{- include "ontoportal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: matomo
        {{- include "ontoportal.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ontoportal.fullname" . }}
      {{- include "ontoportal.podSecurityContext" . | nindent 6 }}
      {{- include "ontoportal.componentScheduling" (list .Values.matomo .) | nindent 6 }}
      containers:
        - name: matomo
          image: {{ include "ontoportal.image" .Values.images.matomo | quote }}
          imagePullPolicy: {{ .Values.images.matomo.pullPolicy }}
          {{- include "ontoportal.containerSecurityContext" . | nindent 10 }}
          env:
            - name: MATOMO_DATABASE_HOST
              value: {{ printf "%s-matomo-db" (include "ontoportal.fullname" .) | quote }}
            - name: MATOMO_DATABASE_DBNAME
              value: {{ .Values.matomo.db.name | quote }}
            - name: MATOMO_DATABASE_USERNAME
              value: {{ .Values.matomo.db.user | quote }}
            - name: MATOMO_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ontoportal.secretName" . }}
                  key: matomoDbPassword
          ports:
            - name: http
              containerPort: 80
          {{- with .Values.matomo.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: matomo-app
              mountPath: /var/www/html
      volumes:
        - name: matomo-app
          {{- include "ontoportal.volumeDataSource" (list . .Values.persistence.matomo.app.existingClaim (printf "%s-matomo-app" (include "ontoportal.fullname" .))) | nindent 10 }}
{{- if .Values.matomo.archive.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ontoportal.fullname" . }}-matomo-archive
  namespace: {{ include "ontoportal.namespace" . }}
  labels:
    app.kubernetes.io/component: matomo-archive
    {{- include "ontoportal.labels" . | nindent 4 }}
  {{- include "ontoportal.annotations" . | nindent 2 }}
spec:
  schedule: {{ .Values.matomo.archive.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ include "ontoportal.fullname" . }}
          {{- include "ontoportal.podSecurityContext" . | nindent 10 }}
          containers:
            - name: archive
              image: {{ include "ontoportal.image" .Values.images.matomo | quote }}
              imagePullPolicy: {{ .Values.images.matomo.pullPolicy }}
              {{- include "ontoportal.containerSecurityContext" . | nindent 14 }}
              command: ["bash", "-lc"]
              args:
                - php /var/www/html/console core:archive --url={{ .Values.matomo.url | default (printf "http://%s-matomo" (include "ontoportal.fullname" .)) | quote }}
              {{- with .Values.matomo.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              volumeMounts:
                - name: matomo-app
                  mountPath: /var/www/html
          volumes:
            - name: matomo-app
              {{- include "ontoportal.volumeDataSource" (list . .Values.persistence.matomo.app.existingClaim (printf "%s-matomo-app" (include "ontoportal.fullname" .))) | nindent 14 }}
{{- end }}
{{- end }}
