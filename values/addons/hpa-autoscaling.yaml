# OntoPortal chart overlay that uses native Kubernetes autoscaling/v2 HPA for
# API and UI. It assumes the cluster has metrics-server installed and that the
# shared /data volume is backed by a real ReadWriteMany storage class.

persistence:
  shared:
    # API and UI both mount shared /data. Scaling either component beyond one
    # replica requires a storage class that truly supports multi-writer access.
    accessModes: ["ReadWriteMany"]

api:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

ui:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  resources:
    requests:
      cpu: 300m
      memory: 768Mi
    limits:
      memory: 1536Mi

podDisruptionBudgets:
  api:
    enabled: true
    minAvailable: 1
  ui:
    enabled: true
    minAvailable: 1

autoscaling:
  api:
    enabled: true
    mode: hpa
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Percent
            value: 50
            periodSeconds: 60
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
          - type: Pods
            value: 2
            periodSeconds: 60
  ui:
    enabled: true
    mode: hpa
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Percent
            value: 50
            periodSeconds: 60
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
          - type: Pods
            value: 1
            periodSeconds: 60
