# Complete, k3s-friendly External Secrets example using the Kubernetes provider.
#
# This is a safe rehearsal pattern: secrets live in a source namespace and the
# External Secrets Operator copies selected keys to the application namespace.
# For production, replace the source Secret with Vault, AWS Secrets Manager,
# GCP Secret Manager, Azure Key Vault, 1Password, etc.
apiVersion: v1
kind: Namespace
metadata:
  name: ontoportal-secret-source
---
apiVersion: v1
kind: Secret
metadata:
  name: ontoportal-prod-source
  namespace: ontoportal-secret-source
type: Opaque
stringData:
  apiKey: replace-with-random-api-key
  adminPassword: replace-with-admin-password
  mysqlRootPassword: replace-with-mysql-root-password
  storeDbaPassword: replace-with-store-dba-password
  storeDavPassword: replace-with-store-dav-password
  matomoDbPassword: replace-with-matomo-db-password
  matomoDbRootPassword: replace-with-matomo-db-root-password
  mobiSyncInternalToken: replace-with-mobi-sync-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-read-ontoportal-prod-source
  namespace: ontoportal-secret-source
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ontoportal-prod-source"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-read-ontoportal-prod-source
  namespace: ontoportal-secret-source
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-read-ontoportal-prod-source
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: k3s-incluster-kubernetes
spec:
  provider:
    kubernetes:
      remoteNamespace: ontoportal-secret-source
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: ontoportal-secret-source
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets
